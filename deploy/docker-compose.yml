services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Branding__SchoolName: ${BRANDING__SCHOOLNAME}
      Branding__LogoUrl: ${BRANDING__LOGOURL}
      Branding__PrimaryColor: ${BRANDING__PRIMARYCOLOR}
      Branding__SecondaryColor: ${BRANDING__SECONDARYCOLOR}
      Branding__Timezone: ${BRANDING__TIMEZONE}
      School__AttendanceLateThresholdMinutes: ${SCHOOL__ATTENDANCELATETHRESHOLDMINUTES}
      School__DefaultTimezone: ${SCHOOL__DEFAULTTIMEZONE}
      School__SchoolDayStartTime: ${SCHOOL__SCHOOLDAYSTARTTIME}
      Iot__HeartbeatIntervalSeconds: ${IOT__HEARTBEATINTERVALSECONDS}
      Iot__OfflineThresholdMultiplier: ${IOT__OFFLINETHRESHOLDMULTIPLIER}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
      Jwt__Issuer: ${JWT__ISSUER}
      Jwt__Audience: ${JWT__AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT__EXPIRYMINUTES}
      Seed__AdminEmail: ${SEED__ADMINEMAIL}
      Seed__AdminPassword: ${SEED__ADMINPASSWORD}
      Smtp__Host: ${SMTP__HOST}
      Smtp__Port: ${SMTP__PORT}
      Smtp__Username: ${SMTP__USERNAME}
      Smtp__Password: ${SMTP__PASSWORD}
      Smtp__UseSsl: ${SMTP__USESSL}
      Smtp__FromAddress: ${SMTP__FROMADDRESS}
      Smtp__FromName: ${SMTP__FROMNAME}
      Notifications__NotifyGuardiansOnAbsence: ${NOTIFICATIONS__NOTIFYGUARDIANSONABSENCE}
    ports:
      - "8080:8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../client/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  postgres-data:
